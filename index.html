<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أثَـــر | ATHAR LEGACY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="أثر">
    <meta name="theme-color" content="#000000">

    <style>
        :root { --neon: #00ffcc; --neon-2: #00f2ff; --emergency: #ff3366; }
        
        body { 
            margin: 0; background: #000; color: #fff; 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            display: flex; flex-direction: column; align-items: center; 
            justify-content: center;
            min-height: 100vh; overflow-x: hidden;
            padding: 10px; box-sizing: border-box;
        }

        #langToggle {
            position: fixed; top: 15px; left: 15px; z-index: 10;
            background: rgba(0, 255, 204, 0.1); border: 1px solid var(--neon);
            color: var(--neon); padding: 6px 12px; border-radius: 20px;
            font-size: 0.7rem; font-weight: bold; cursor: pointer; backdrop-filter: blur(5px);
            transition: 0.3s;
        }
        #langToggle:hover { background: var(--neon); color: #000; }

        #canvas-container { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
        #nfc-canvas { width: 100%; height: 100%; }

        /* شاشة التحميل العملية والنظيفة المتوافقة مع ستايل الموقع */
        #loading-screen { 
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92); 
            z-index: 100; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            transition: opacity 0.6s; backdrop-filter: blur(12px);
        }

        .loading-card {
            background: rgba(10, 30, 20, 0.94); padding: 2rem 1.5rem;
            border-radius: 25px; border: 1px solid var(--neon);
            width: 85%; max-width: 320px; text-align: center;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.15);
            display: flex; flex-direction: column; align-items: center;
        }

        .loading-logo {
            font-size: 1.8rem; letter-spacing: 4px; color: #fff;
            text-shadow: 0 0 12px var(--neon); margin-bottom: 20px;
        }

        .neon-msg { 
            font-size: 0.95rem; color: var(--neon); text-shadow: 0 0 10px var(--neon); 
            opacity: 0; transition: opacity 0.3s ease-in-out; margin-bottom: 25px; min-height: 2.5rem;
            display: flex; align-items: center; justify-content: center; line-height: 1.5;
            font-weight: 500;
        }

        .loader-wrapper { width: 80%; height: 2px; background: rgba(255,255,255,0.1); border-radius: 5px; overflow: hidden; }
        #loader-bar { width: 0%; height: 100%; background: linear-gradient(90deg, var(--neon), var(--neon-2)); box-shadow: 0 0 10px var(--neon); transition: width 0.4s ease; }

        .card { 
            background: rgba(10, 30, 20, 0.94); padding: 1.5rem; 
            border-radius: 25px; border: 1px solid var(--neon); 
            width: 90%; max-width: 400px; z-index: 2; 
            backdrop-filter: blur(15px); text-align: center; 
            display: none; opacity: 0; transition: 0.8s; margin: 10px 0;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.12); 
            max-height: 90vh; overflow-y: auto;
            box-sizing: border-box;
        }

        h1 { margin: 0 0 5px 0; font-size: 2.2rem; text-shadow: 0 0 12px var(--neon); letter-spacing: 4px; }
        .tagline { color: var(--neon-2); font-size: 0.65rem; letter-spacing: 2px; margin-bottom: 15px; text-transform: uppercase; }
        
        .description { text-align: right; border-right: 3px solid var(--neon); padding-right: 12px; margin: 15px 0; }
        [dir="ltr"] .description { text-align: left; border-right: none; border-left: 3px solid var(--neon); padding-right: 0; padding-left: 12px; }
        .description p { font-size: 0.8rem; line-height: 1.6; color: #ddd; margin: 6px 0; }

        .info-box { background: rgba(255, 255, 255, 0.04); padding: 10px 12px; border-radius: 12px; margin: 8px 0; border-right: 3px solid var(--neon); text-align: right; }
        [dir="ltr"] .info-box { text-align: left; border-right: none; border-left: 3px solid var(--neon); }
        .info-box strong { color: var(--neon-2); font-size: 0.65rem; display: block; margin-bottom: 3px; }
        .info-box span { font-size: 0.95rem; color: #fff; }

        .info-box.emergency { border-right-color: var(--emergency); background: rgba(255, 51, 102, 0.04); }
        [dir="ltr"] .info-box.emergency { border-left-color: var(--emergency); }
        .info-box.emergency strong { color: var(--emergency); }
        
        .btn-container { display: flex; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 45%; padding: 10px; border-radius: 10px; font-weight: bold; text-decoration: none; color: #000; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.85rem; cursor: pointer; border: none; }
        .btn-call { background: var(--neon); }
        .btn-wa { background: #25D366; color: #fff; }
        .btn-save { background: var(--neon-2); width: 100%; margin-top: 4px; }

        .social-group {
            background: rgba(0, 255, 204, 0.02);
            border: 1px dashed rgba(0, 255, 204, 0.3);
            padding: 8px; border-radius: 12px; margin: 8px 0; text-align: right;
        }
        [dir="ltr"] .social-group { text-align: left; }
        .social-label { font-size: 0.7rem; color: var(--neon-2); margin-bottom: 4px; display: block; }

        input, select { width: 100%; padding: 11px; margin: 6px 0; background: rgba(0,0,0,0.6); border: 1px solid var(--neon); color: #fff; border-radius: 10px; text-align: right; box-sizing: border-box; font-size: 0.9rem; }
        [dir="ltr"] input, [dir="ltr"] select { text-align: left; }
        #subBtn { width: 100%; padding: 13px; background: linear-gradient(90deg, var(--neon), var(--neon-2)); border: none; border-radius: 10px; font-weight: bold; color: #000; margin-top: 10px; cursor: pointer; font-size: 0.95rem; }
        
        .signature-area { margin-top: 20px; font-size: 0.6rem; color: #555; border-top: 1px solid #222; padding-top: 15px; letter-spacing: 2px; }
    </style>
</head>
<body>

<button id="langToggle" onclick="toggleLanguage()">EN / عربي</button>

<div id="canvas-container"><canvas id="nfc-canvas"></canvas></div>

<!-- شاشة التحميل المخصصة والعملية -->
<div id="loading-screen">
    <div class="loading-card">
        <div class="loading-logo">أثَـــر</div>
        <div id="m-text" class="neon-msg"></div>
        <div class="loader-wrapper"><div id="loader-bar"></div></div>
    </div>
</div>

<div class="card" id="mainLanding">
    <h1>أثَـــر</h1>
    <div class="tagline">ATHAR LEGACY GUIDE</div>
    
    <div class="description">
        <p class="t-desc1">في <span style="color: var(--neon); font-weight: bold;">أثَـــر</span>، نحوّل القطع الفنية إلى مخازن رقمية للذكريات.</p>
        <p class="t-desc2">دمجنا سحر الريزن اليدوي بتقنية NFC المتطورة لتخليد هويتك بلمسة واحدة من جوالك.</p>
    </div>

    <div class="signature-area">PROJECT BY: <span style="color: #999;">WELF BASSAM</span></div>
</div>

<div class="card" id="displayCard" style="position: relative;">
    <div onclick="unlockEdit()" id="editToggle" style="position: absolute; top: 20px; right: 20px; cursor: pointer; opacity: 0.5;">
        <i class="fas fa-user-lock" style="color: var(--neon); font-size: 1rem;"></i>
    </div>
    <h1>أثَـــر</h1>
    <div class="tagline t-viewtag">بيانات صاحب الأثر</div>
    
    <div id="displayFields"></div>
    <div class="btn-container">
        <a id="cBtn" class="btn btn-call"><i class="fas fa-phone"></i> <span class="t-call">اتصال</span></a>
        <a id="wBtn" class="btn btn-wa"><i class="fab fa-whatsapp"></i> <span class="t-wa">واتساب</span></a>
        <button onclick="saveContact()" class="btn btn-save"><i class="fas fa-address-card"></i> <span class="t-save">حفظ في جهات الاتصال</span></button>
    </div>
</div>

<div class="card" id="regCard">
    <h1>أثَـــر</h1>
    <div class="tagline" id="regTitle">تفعيل قطعة جديدة</div>
    <form id="regForm">
        <input type="text" id="regName" placeholder="الاسم الكامل *" required>
        <input type="tel" id="regPhone" placeholder="رقم الجوال *" required>
        <input type="email" id="regEmail" placeholder="البريد الإلكتروني (اختياري)">
        
        <div class="social-group">
            <span class="social-label"><i class="fas fa-share-alt"></i> <span class="t-socialLbl">ربط حساب التواصل (اختياري)</span></span>
            <select id="regPlatform">
                <option value="" id="tOptApp">اختر التطبيق...</option>
                <option>Snapchat</option><option>Instagram</option><option>Telegram</option><option>X</option>
            </select>
            <input type="text" id="regAcc" placeholder="اسم المستخدم أو المعرف...">
        </div>

        <select id="regBlood">
            <option value="" id="tOptBlood">فصيلة الدم (اختياري)</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option><option>O+</option><option>O-</option><option>AB+</option><option>AB-</option>
        </select>
        
        <input type="text" id="regMed" placeholder="أمراض مزمنة أو حساسية؟ (اختياري)">
        <input type="text" id="regPass" placeholder="كلمة السر (4 أرقام لا تبدأ بـ 0) *" pattern="[1-9][0-9]{3}" maxlength="4" title="يجب أن تكون 4 أرقام ولا تبدأ بالصفر" required>
        
        <input type="hidden" id="hCode">
        <button type="submit" id="subBtn">بث الحياة في أثرك</button>
    </form>
</div>

<script>
    const webAppUrl = 'https://script.google.com/macros/s/AKfycbyMbo87H2nz1c2I9pV1j20A80XKL9mr6ahEhXjMnjWG6j4IjyvaCBBReRhe_gPkVA5s/exec'; 
    const code = new URLSearchParams(window.location.search).get('code');
    const bar = document.getElementById('loader-bar');
    const msgEl = document.getElementById('m-text');
    let currentPass = ""; 
    let globalData = {}; 
    let currentLang = 'ar';

    const translations = {
        ar: {
            viewtag: "بيانات صاحب الأثر",
            regtitle: "تفعيل قطعة جديدة",
            updatetitle: "تحديث بيانات الأثر",
            call: "اتصال",
            wa: "واتساب",
            save: "حفظ في جهات الاتصال",
            subreg: "بث الحياة في أثرك",
            subup: "حفظ التغييرات",
            nameLbl: "صاحب الأثر",
            phoneLbl: "رقم الجوال",
            emailLbl: "البريد الإلكتروني",
            bloodLbl: "فصيلة الدم",
            medLbl: "الحالة الصحية / حساسية",
            socialLbl: "التواصل",
            pName: "الاسم الكامل *",
            pPhone: "رقم الجوال *",
            pEmail: "البريد الإلكتروني (اختياري)",
            pSocialLbl: "ربط حساب التواصل (اختياري)",
            pApp: "اختر التطبيق...",
            pAcc: "اسم المستخدم أو المعرف...",
            pBlood: "فصيلة الدم (اختياري)",
            pMed: "أمراض مزمنة أو حساسية؟ (اختياري)",
            pPass: "كلمة السر (4 أرقام لا تبدأ بـ 0) *",
            loadSearching: "جاري البحث عن صاحب الأثر...",
            loadFound: "تم العثور على المعلومات!",
            loadNew: "مستخدم جديد.. مرحباً بك في عالم أثَر"
        },
        en: {
            viewtag: "ATHAR OWNER PROFILE",
            regtitle: "ACTIVATE NEW PIECE",
            updatetitle: "UPDATE ATHAR DATA",
            call: "Call",
            wa: "WhatsApp",
            save: "Save to Contacts",
            subreg: "Breathe Life Into Your Athar",
            subup: "Save Changes",
            nameLbl: "Athar Owner",
            phoneLbl: "Phone Number",
            emailLbl: "Email",
            bloodLbl: "Blood Type",
            medLbl: "Medical Condition / Allergy",
            socialLbl: "Social Media",
            pName: "Full Name *",
            pPhone: "Phone Number *",
            pEmail: "Email (Optional)",
            pSocialLbl: "Link Social Account (Optional)",
            pApp: "Select App...",
            pAcc: "Username or Handle...",
            pBlood: "Blood Type (Optional)",
            pMed: "Chronic Disease or Allergy? (Optional)",
            pPass: "Password (4 digits, not starting with 0) *",
            loadSearching: "Searching for Athar owner...",
            loadFound: "Information found!",
            loadNew: "New user.. Welcome to Athar"
        }
    };

    const medicalDict = {
        "حساسية اللاكتوز": "Lactose Intolerance",
        "حساسية البنسلين": "Penicillin Allergy",
        "ربو": "Asthma",
        "سكري": "Diabetes",
        "الضغط": "Hypertension",
        "حساسية الفول السوداني": "Peanut Allergy"
    };

    function translateMedical(text) {
        if (!text) return "";
        if (currentLang === 'en') {
            let trimmed = text.trim();
            return medicalDict[trimmed] || text;
        }
        return text;
    }

    function toggleLanguage() {
        currentLang = currentLang === 'ar' ? 'en' : 'ar';
        const root = document.getElementById('htmlRoot');
        root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
        root.setAttribute('lang', currentLang);
        
        const t = translations[currentLang];
        
        document.querySelector('.t-viewtag').innerText = t.viewtag;
        document.querySelector('.t-call').innerText = t.call;
        document.querySelector('.t-wa').innerText = t.wa;
        document.querySelector('.t-save').innerText = t.save;
        document.querySelector('.t-socialLbl').innerText = t.socialLbl;
        
        document.getElementById('regName').placeholder = t.pName;
        document.getElementById('regPhone').placeholder = t.pPhone;
        document.getElementById('regEmail').placeholder = t.pEmail;
        document.getElementById('tOptApp').innerText = t.pApp;
        document.getElementById('regAcc').placeholder = t.pAcc;
        document.getElementById('tOptBlood').innerText = t.pBlood;
        document.getElementById('regMed').placeholder = t.pMed;
        document.getElementById('regPass').placeholder = t.pPass;
        
        const regTitleEl = document.getElementById('regTitle');
        if (regTitleEl.innerText.includes('تفعيل') || regTitleEl.innerText.includes('ACTIVATE')) {
            regTitleEl.innerText = t.regtitle;
        } else {
            regTitleEl.innerText = t.updatetitle;
        }

        const subBtn = document.getElementById('subBtn');
        if (subBtn.innerText.includes('بث') || subBtn.innerText.includes('Breathe')) {
            subBtn.innerText = t.subreg;
        } else {
            subBtn.innerText = t.subup;
        }
        
        if(globalData.name) renderData(globalData);
    }

    async function changeMsg(txt, p, duration = 1200) {
        msgEl.style.opacity = '0';
        await new Promise(r => setTimeout(r, 300));
        msgEl.innerText = txt;
        msgEl.style.opacity = '1';
        bar.style.width = p + '%';
        await new Promise(r => setTimeout(r, duration));
    }

    async function run() {
        const t = translations[currentLang];
        if (!code) {
            finish('mainLanding');
            return;
        }
        await changeMsg(t.loadSearching, 50, 600);
        try {
            const res = await fetch(`${webAppUrl}?read=${encodeURIComponent(code)}`);
            const data = await res.json();
            if (data.status === "تم التفعيل") {
                globalData = data; 
                renderData(data);
                await changeMsg(t.loadFound, 100, 600);
                finish('displayCard');
            } else {
                await changeMsg(t.loadNew, 100, 800);
                document.getElementById('hCode').value = code;
                finish('regCard');
            }
        } catch(e) { finish('mainLanding'); }
    }

    function renderData(data) {
        currentPass = data.password !== undefined && data.password !== null ? String(data.password).trim() : ""; 
        const container = document.getElementById('displayFields');
        const t = translations[currentLang];
        
        let html = `
            <div class="info-box"><strong>${t.nameLbl}</strong> <span>${data.name}</span></div>
            <div class="info-box"><strong>${t.phoneLbl}</strong> <span>${data.phone}</span></div>
        `;
        if(data.email && data.email !== "undefined") html += `<div class="info-box"><strong>${t.emailLbl}</strong> <span>${data.email}</span></div>`;
        if(data.blood) html += `<div class="info-box" style="border-right-color: var(--neon-2);"><strong>${t.bloodLbl}</strong> <span style="color: var(--neon-2); font-weight: bold;">${data.blood}</span></div>`;
        
        if(data.medical && data.medical !== "undefined") {
            const translatedMedical = translateMedical(data.medical);
            html += `<div class="info-box emergency"><strong><i class="fas fa-heartbeat"></i> ${t.medLbl}</strong> <span style="color: #ff99bb;">${translatedMedical}</span></div>`;
        }
        
        if(data.account && data.account !== "undefined") html += `<div class="info-box"><strong>${t.socialLbl}</strong> <span>${data.account}</span></div>`;
        
        container.innerHTML = html;
        document.getElementById('cBtn').href = `tel:${data.phone}`;
        document.getElementById('wBtn').href = `https://wa.me/${data.phone}`;
        
        document.getElementById('regName').value = data.name;
        document.getElementById('regPhone').value = data.phone;
        document.getElementById('regEmail').value = (data.email !== "undefined") ? data.email : "";
        document.getElementById('regMed').value = (data.medical !== "undefined") ? data.medical : "";
        document.getElementById('hCode').value = code;
    }

    function saveContact() {
        if (!globalData.name || !globalData.phone) return;
        const vcard = `BEGIN:VCARD\nVERSION:3.0\nFN:${globalData.name}\nTEL:${globalData.phone}\nEMAIL:${globalData.email || ''}\nNOTE:تم الحفظ عبر مشروع أثر - Athar Legacy\nEND:VCARD`;
        const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', `${globalData.name}.vcf`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function unlockEdit() {
        const userPass = prompt(currentLang === 'ar' ? "أدخل كلمة السر (4 أرقام):" : "Enter Password (4 digits):");
        if (userPass === null) return;
        
        const inputPass = String(userPass).trim();
        const storedPass = String(currentPass).trim();

        if (inputPass === storedPass && storedPass !== "") {
            document.getElementById('displayCard').style.display = 'none';
            document.getElementById('regCard').style.display = 'block';
            setTimeout(() => document.getElementById('regCard').style.opacity = '1', 50);
            document.getElementById('regTitle').innerText = translations[currentLang].updatetitle;
            document.getElementById('subBtn').innerText = translations[currentLang].subup;
        } else {
            alert(currentLang === 'ar' ? "عذراً، كلمة السر غير صحيحة." : "Sorry, incorrect password.");
        }
    }

    function finish(id) {
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => {
            document.getElementById('loading-screen').style.display = 'none';
            const el = document.getElementById(id);
            el.style.display = 'block';
            setTimeout(() => el.style.opacity = '1', 50);
        }, 500);
    }

    const canvas = document.getElementById('nfc-canvas');
    const ctx = canvas.getContext('2d');
    let w, h, particles = [];
    function init() {
        w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
        particles = []; for(let i=0; i<35; i++) particles.push(new Particle());
    }
    class Particle {
        constructor() { this.reset(); }
        reset() {
            this.x = Math.random() * w; this.y = Math.random() * h;
            this.speed = Math.random() * 1.2 + 0.6;
            this.life = Math.random() * 100 + 60;
            this.color = Math.random() > 0.5 ? '#00ffcc' : '#00f2ff';
            this.angle = (Math.floor(Math.random() * 8) * 45) * Math.PI / 180;
        }
        update() {
            this.x += Math.cos(this.angle) * this.speed;
            this.y += Math.sin(this.angle) * this.speed;
            this.life--;
            if(Math.random() < 0.03) this.angle = (Math.floor(Math.random() * 8) * 45) * Math.PI / 180;
            if(this.life <= 0 || this.x<0 || this.x>w || this.y<0 || this.y>h) this.reset();
        }
        draw() {
            ctx.beginPath(); ctx.shadowBlur = 10; ctx.shadowColor = this.color;
            ctx.strokeStyle = this.color; ctx.lineWidth = 1.3;
            ctx.moveTo(this.x, this.y);
            ctx.lineTo(this.x - Math.cos(this.angle)*18, this.y - Math.sin(this.angle)*18);
            ctx.stroke(); ctx.shadowBlur = 0;
        }
    }
    function animate() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
        ctx.fillRect(0, 0, w, h);
        particles.forEach(p => { p.update(); p.draw(); });
        requestAnimationFrame(animate);
    }
    init(); animate(); window.onload = run; window.onresize = init;

    document.getElementById('regForm').onsubmit = function(e) {
        e.preventDefault();
        const btn = document.getElementById('subBtn');
        btn.innerText = currentLang === 'ar' ? 'جاري المعالجة...' : 'Processing...'; 
        btn.disabled = true;
        const p = document.getElementById('regPlatform').value;
        const a = document.getElementById('regAcc').value;
        const params = new URLSearchParams();
        params.append('name', document.getElementById('regName').value);
        params.append('phone', document.getElementById('regPhone').value);
        params.append('email', document.getElementById('regEmail').value);
        params.append('account', p ? p + ": " + a : a);
        params.append('bloodType', document.getElementById('regBlood').value);
        params.append('medical', document.getElementById('regMed').value);
        params.append('password', String(document.getElementById('regPass').value).trim());
        params.append('itemCode', document.getElementById('hCode').value);
        fetch(webAppUrl, { method: 'POST', mode: 'no-cors', body: params })
        .then(() => { alert(currentLang === 'ar' ? 'تم بنجاح!' : 'Success!'); location.reload(); });
    };
</script>
</body>
</html>
